name: Conta do Mateus vira aluno (temporário)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite CONVERTER para confirmar"
        required: true

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Conferir confirmação
        if: inputs.confirm != 'CONVERTER'
        run: |
          echo "Sem a confirmação CONVERTER nada muda."
          exit 1

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Converter
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          cat > convert.js <<'JS'
          const { Pool } = require('pg');
          const { createClient } = require('@supabase/supabase-js');
          const fs = require('fs');
          const OWNER = 'mateuscarddosointencional@gmail.com';
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const mask = (e) => `${String(e).slice(0, 3)}***@${String(e).split('@')[1] || ''}`;
          (async () => {
            const owner = (await pool.query(
              `SELECT id, email, role FROM profiles WHERE lower(email) = $1 AND deleted_at IS NULL`, [OWNER],
            )).rows;
            if (owner.length !== 1) throw new Error(`Conta principal encontrada ${owner.length} vezes.`);
            const a = owner[0];

            const dupes = (await pool.query(
              `SELECT p.id, p.email FROM profiles p
               WHERE p.id <> $1 AND p.role = 'ambassador' AND p.deleted_at IS NULL
                 AND p.public_name = 'Mateus Cardoso' AND lower(p.email) LIKE 'mat%'
                 AND NOT EXISTS (
                   SELECT 1 FROM social_accounts sa
                   WHERE sa.profile_id = p.id AND sa.status = 'connected' AND sa.disconnected_at IS NULL
                 )`, [a.id],
            )).rows;
            if (dupes.length > 1) throw new Error(`Contas duplicadas: ${dupes.length}. Nada foi mudado.`);

            const admins = (await pool.query(
              `SELECT email FROM profiles WHERE role = 'admin' AND deleted_at IS NULL AND id <> $1`, [a.id],
            )).rows;
            if (!admins.length) throw new Error('Não sobraria nenhuma conta de equipe. Nada foi mudado.');

            const ig = (await pool.query(
              `SELECT username FROM social_accounts
               WHERE profile_id = $1 AND platform = 'instagram' AND disconnected_at IS NULL
               ORDER BY created_at DESC LIMIT 1`, [a.id],
            )).rows[0];
            const handle = ig && ig.username ? `@${String(ig.username).replace(/^@/, '')}` : null;

            const client = await pool.connect();
            try {
              await client.query('BEGIN');
              await client.query(
                `UPDATE profiles
                 SET role = 'ambassador', full_name = 'Mateus Cardoso', public_name = 'Mateus Cardoso',
                     onboarding_completed = true, updated_at = now()
                 WHERE id = $1`, [a.id],
              );
              await client.query(
                `UPDATE ambassador_memberships
                 SET status = 'approved', approved_at = COALESCE(approved_at, now()), updated_at = now()
                 WHERE profile_id = $1`, [a.id],
              );
              await client.query(
                `INSERT INTO applications (nome_completo, email, whatsapp, nome_conta, redes_sociais,
                                           instagram_handle, profile_id, status)
                 SELECT 'Mateus Cardoso', $2, '', $3, $4, $5, $1, 'approved'
                 WHERE NOT EXISTS (
                   SELECT 1 FROM applications WHERE profile_id = $1 OR lower(email) = $2
                 )`,
                [a.id, OWNER, handle ? `Instagram ${handle}` : 'Mateus Cardoso',
                 handle ? ['instagram'] : [], handle],
              );
              for (const d of dupes) {
                await client.query('DELETE FROM ranking_entries WHERE profile_id = $1', [d.id]);
                await client.query('UPDATE audit_logs SET actor_id = NULL WHERE actor_id = $1', [d.id]);
                await client.query('DELETE FROM social_accounts WHERE profile_id = $1', [d.id]);
                await client.query(
                  'DELETE FROM applications WHERE profile_id = $1 OR lower(email) = lower($2)', [d.id, d.email],
                );
              }
              await client.query('COMMIT');
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            } finally {
              client.release();
            }

            const auth = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
            for (const d of dupes) {
              const { error } = await auth.auth.admin.deleteUser(d.id);
              if (error) throw new Error(error.message);
              await pool.query('DELETE FROM profiles WHERE id = $1', [d.id]);
              for (const ext of ['jpg', 'png', 'webp']) {
                fs.rmSync(`${process.env.AVATAR_DIR || '/app/cache/avatars'}/${d.id}.${ext}`, { force: true });
              }
              console.log(`Conta duplicada apagada: ${mask(d.email)}`);
            }
            console.log(`Conta principal agora é de aluno: ${mask(a.email)} | Instagram ${handle || 'nenhum'}`);
            console.log(`Equipe que continua: ${admins.map((r) => mask(r.email)).join(', ')}`);
            await pool.end();
          })().catch((error) => {
            console.error('ERRO ' + (error && error.message ? error.message : error));
            process.exit(1);
          });
          JS
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/embaixadores && docker compose -f docker-compose.yml -f docker-compose.vps.yml exec -T app node -" < convert.js

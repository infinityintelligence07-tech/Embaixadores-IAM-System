name: Aplicar migration (temporário)

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Arquivo em supabase/migrations a aplicar"
        required: true
      confirm:
        description: "Digite APLICAR para confirmar"
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Conferir confirmação e arquivo
        env:
          FILE: ${{ inputs.file }}
        run: |
          if [ "${{ inputs.confirm }}" != "APLICAR" ]; then echo "Sem APLICAR nada roda."; exit 1; fi
          case "$FILE" in *[!A-Za-z0-9_.-]*|"") echo "Nome de arquivo inválido."; exit 1;; esac
          test -f "supabase/migrations/$FILE"

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Aplicar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          FILE: ${{ inputs.file }}
        run: |
          SQL_B64=$(base64 -w0 "supabase/migrations/$FILE")
          cat > apply.js <<'JS'
          const { Pool } = require('pg');
          const sql = Buffer.from(process.env.SQL_B64, 'base64').toString('utf8');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            const client = await pool.connect();
            try {
              await client.query('BEGIN');
              await client.query(sql);
              await client.query('COMMIT');
              const policies = await client.query(
                `SELECT tablename, policyname, cmd FROM pg_policies WHERE schemaname = 'public'
                 AND tablename IN ('profiles','social_accounts','oauth_states','ranking_versions','ranking_entries')
                 ORDER BY tablename, policyname`,
              );
              for (const p of policies.rows) console.log(`${p.tablename} | ${p.policyname} | ${p.cmd}`);
              console.log('Migration aplicada.');
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            } finally {
              client.release();
              await pool.end();
            }
          })().catch((error) => {
            console.error('ERRO ' + (error && error.message ? error.message : error));
            process.exit(1);
          });
          JS
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/embaixadores && docker compose -f docker-compose.yml -f docker-compose.vps.yml exec -T -e SQL_B64=$SQL_B64 app node -" < apply.js

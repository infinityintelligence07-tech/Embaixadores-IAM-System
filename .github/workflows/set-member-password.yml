name: Definir senha de acesso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  senha:
    name: Definir senha
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar senha no Supabase
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MEMBER_PASSWORD: ${{ secrets.MEMBER_LOGIN_PASSWORD }}
        run: |
          if [ -z "$MEMBER_PASSWORD" ]; then
            echo "Senha ausente."
            exit 1
          fi
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "MEMBER_PASSWORD=$(printf '%q' "$MEMBER_PASSWORD") python3 -" <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          env = {}
          for line in Path("/opt/embaixadores/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value.strip().strip('"').strip("'")

          base = env["SUPABASE_URL"].rstrip("/")
          service = env["SUPABASE_SERVICE_ROLE_KEY"]
          email = "mateuscps900@gmail.com"
          password = os.environ["MEMBER_PASSWORD"]
          headers = {
              "apikey": service,
              "Authorization": "Bearer " + service,
              "Content-Type": "application/json",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as res:
                      raw = res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read().decode()
                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = {"message": "erro"}
                  return err.code, body

          found = None
          page = 1
          while page <= 10 and found is None:
              status, body = request("GET", f"/auth/v1/admin/users?page={page}&per_page=200")
              if status != 200:
                  print("lista_usuarios", status)
                  raise SystemExit(1)
              users = body.get("users") or []
              for user in users:
                  if (user.get("email") or "").lower() == email:
                      found = user
                      break
              if len(users) < 200:
                  break
              page += 1

          if found is None:
              status, body = request(
                  "POST",
                  "/auth/v1/admin/users",
                  {
                      "email": email,
                      "password": password,
                      "email_confirm": True,
                      "user_metadata": {"full_name": "Matheus", "public_name": "Matheus"},
                  },
              )
              if status not in (200, 201):
                  print("criar", status)
                  raise SystemExit(1)
              user_id = (body.get("id") or (body.get("user") or {}).get("id"))
              action = "criada"
          else:
              status, body = request(
                  "PUT",
                  "/auth/v1/admin/users/" + found["id"],
                  {"password": password, "email_confirm": True},
              )
              if status != 200:
                  print("atualizar", status)
                  raise SystemExit(1)
              user_id = found["id"]
              action = "atualizada"

          status, profile = request(
              "GET",
              "/rest/v1/profiles?id=eq." + user_id + "&select=role,public_name",
          )
          role = "desconhecido"
          public_name = ""
          if status == 200 and isinstance(profile, list) and profile:
              role = profile[0].get("role") or role
              public_name = profile[0].get("public_name") or ""
          print("conta", action)
          print("papel", role)
          print("nome", public_name)
          PY

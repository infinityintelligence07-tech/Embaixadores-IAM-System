name: Acesso temporário de auditoria

on:
  workflow_dispatch:
    inputs:
      acao:
        description: criar ou remover
        required: true
        default: criar

permissions:
  contents: read

jobs:
  acesso:
    name: Conta de auditoria
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Executar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AUDIT_PASSWORD: ${{ secrets.AUDIT_ADMIN_PASSWORD }}
          ACAO: ${{ inputs.acao }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "AUDIT_PASSWORD=$(printf '%q' "$AUDIT_PASSWORD") ACAO=$(printf '%q' "$ACAO") python3 -" <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          env = {}
          for line in Path("/opt/embaixadores/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value.strip().strip('"').strip("'")

          base = env["SUPABASE_URL"].rstrip("/")
          service = env["SUPABASE_SERVICE_ROLE_KEY"]
          email = "auditoria@iamcontrol.com.br"
          acao = os.environ.get("ACAO", "criar")
          headers = {
              "apikey": service,
              "Authorization": "Bearer " + service,
              "Content-Type": "application/json",
              "Prefer": "return=representation",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as res:
                      raw = res.read().decode()
                      return res.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  raw = err.read().decode()
                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = {"message": "erro"}
                  return err.code, body

          def find_user():
              page = 1
              while page <= 10:
                  status, body = request("GET", f"/auth/v1/admin/users?page={page}&per_page=200")
                  if status != 200:
                      print("lista_usuarios", status)
                      raise SystemExit(1)
                  users = body.get("users") or []
                  for user in users:
                      if (user.get("email") or "").lower() == email:
                          return user
                  if len(users) < 200:
                      return None
                  page += 1
              return None

          found = find_user()

          if acao == "remover":
              if found is None:
                  print("conta ausente")
                  raise SystemExit(0)
              status, _ = request("DELETE", "/auth/v1/admin/users/" + found["id"])
              print("remocao", status)
              raise SystemExit(0 if status in (200, 204) else 1)

          password = os.environ.get("AUDIT_PASSWORD", "")
          if len(password) < 12:
              print("senha ausente")
              raise SystemExit(1)

          if found is None:
              status, body = request(
                  "POST",
                  "/auth/v1/admin/users",
                  {
                      "email": email,
                      "password": password,
                      "email_confirm": True,
                      "user_metadata": {"full_name": "Auditoria IAM", "public_name": "Auditoria"},
                  },
              )
              if status not in (200, 201):
                  print("criar", status)
                  raise SystemExit(1)
              user_id = body.get("id") or (body.get("user") or {}).get("id")
          else:
              status, _ = request(
                  "PUT",
                  "/auth/v1/admin/users/" + found["id"],
                  {"password": password, "email_confirm": True},
              )
              if status != 200:
                  print("atualizar", status)
                  raise SystemExit(1)
              user_id = found["id"]

          status, _ = request("PATCH", "/rest/v1/profiles?id=eq." + user_id, {"role": "admin", "onboarding_completed": True})
          print("perfil", status)
          status, _ = request(
              "PATCH",
              "/rest/v1/ambassador_memberships?profile_id=eq." + user_id,
              {"status": "approved", "approved_at": "now()"},
          )
          print("membro", status)
          print("conta pronta")
          PY

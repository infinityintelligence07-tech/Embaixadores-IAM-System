name: Conferir configuração

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir .env da VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ler formato das variáveis
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'python3 -' <<'PY'
          import re
          from pathlib import Path
          for line in Path("/opt/embaixadores/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              value = value.strip().strip('"').strip("'")
              shape = re.sub(r"[a-z]", "a", re.sub(r"[A-Z]", "A", re.sub(r"[0-9]", "9", value)))
              print(f"{key} len={len(value)} start={value[:2]} shape={shape[:6]}")
          PY
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'cd /opt/embaixadores && docker compose -f docker-compose.yml -f docker-compose.vps.yml logs --since 24h backend 2>/dev/null | grep -iE "tiktok|error|warn" | grep -viE "instagram profile|token=" | tail -n 60'

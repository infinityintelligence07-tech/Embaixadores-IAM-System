name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy na VPS
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://areaembaixadores.iamcontrol.com.br
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Gravar credenciais do Instagram
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          META_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          META_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          if [ -z "$META_APP_ID" ] || [ -z "$META_APP_SECRET" ]; then
            echo "Segredos do Instagram ausentes. O .env da VPS fica como está."
            exit 0
          fi
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "META_APP_ID=$(printf '%q' "$META_APP_ID") META_APP_SECRET=$(printf '%q' "$META_APP_SECRET") python3 -" <<'PY'
          from pathlib import Path
          import os
          path = Path("/opt/embaixadores/.env")
          text = path.read_text()
          def set_key(text, key, value):
              lines = text.splitlines()
              found = False
              out = []
              for line in lines:
                  if line.startswith(key + "="):
                      out.append(f"{key}={value}")
                      found = True
                  else:
                      out.append(line)
              if not found:
                  out.append(f"{key}={value}")
              return "\n".join(out) + "\n"
          updated = set_key(text, "META_APP_ID", os.environ["META_APP_ID"])
          updated = set_key(updated, "META_APP_SECRET", os.environ["META_APP_SECRET"])
          path.write_text(updated)
          print("Instagram credentials updated. id_len=" + str(len(os.environ["META_APP_ID"])))
          PY

      - name: Executar deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' < scripts/deploy.sh

      - name: Verificar domínio público
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://areaembaixadores.iamcontrol.com.br/api/health | grep -q '"status":"healthy"'; then
              exit 0
            fi
            sleep 6
          done
          exit 1

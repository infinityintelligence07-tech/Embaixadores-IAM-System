name: Conferir nova regra do ranking (temporário)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Comparar regras (só leitura)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          cat > check.js <<'JS'
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          const media = (a) => `(${a}.platform <> 'instagram' OR upper(${a}.media_type) = 'VIDEO')`;
          const last = (b) => `SELECT cs.views FROM content_metric_snapshots cs
            WHERE cs.content_id = e.id AND cs.views IS NOT NULL AND cs.collected_at < ${b}
            ORDER BY cs.collected_at DESC LIMIT 1`;
          const GAINS = `
            WITH eligible AS (
              SELECT c.id, c.published_at FROM contents c
              WHERE c.social_account_id = $1 AND c.eligible = true AND c.excluded_at IS NULL
                AND c.removed_on_platform = false AND ${media('c')}
            ),
            watched_since AS (
              SELECT MIN(cs.collected_at) AS at FROM content_metric_snapshots cs
              JOIN eligible e ON e.id = cs.content_id WHERE cs.views IS NOT NULL
            ),
            gains AS (
              SELECT e.id, GREATEST(COALESCE(final.views, 0) - CASE
                  WHEN e.published_at >= $2 THEN 0
                  WHEN before.views IS NOT NULL THEN before.views
                  WHEN e.published_at >= (SELECT at FROM watched_since) THEN 0
                  ELSE COALESCE(first_seen.views, 0) END, 0) AS gained
              FROM eligible e
              LEFT JOIN LATERAL (${last('$3')}) final ON true
              LEFT JOIN LATERAL (${last('$2')}) before ON true
              LEFT JOIN LATERAL (
                SELECT cs.views FROM content_metric_snapshots cs
                WHERE cs.content_id = e.id AND cs.views IS NOT NULL AND cs.collected_at >= $2
                ORDER BY cs.collected_at ASC LIMIT 1
              ) first_seen ON true
            )`;
          (async () => {
            const camp = (await pool.query(
              `SELECT id, name, starts_at, ends_at FROM campaigns WHERE kind = 'monthly'
               ORDER BY starts_at DESC LIMIT 1`)).rows[0];
            console.log(`Período: ${camp.name}`);
            const accounts = (await pool.query(
              `SELECT sa.id, sa.platform, p.public_name, p.role,
                      (SELECT count(*) FROM contents c WHERE c.social_account_id = sa.id) AS videos,
                      (SELECT count(*) FROM content_metric_snapshots cs JOIN contents c ON c.id = cs.content_id
                        WHERE c.social_account_id = sa.id) AS readings
               FROM social_accounts sa JOIN profiles p ON p.id = sa.profile_id
               WHERE sa.disconnected_at IS NULL`)).rows;
            for (const a of accounts) {
              const t0 = Date.now();
              const nova = (await pool.query(
                `${GAINS} SELECT COALESCE(SUM(gained),0) AS total, COALESCE(MAX(gained),0) AS best FROM gains`,
                [a.id, camp.starts_at, camp.ends_at])).rows[0];
              const ms = Date.now() - t0;
              const antiga = (await pool.query(
                `SELECT COALESCE(SUM(c.latest_views),0) AS total FROM contents c
                 WHERE c.social_account_id = $1 AND c.eligible AND c.excluded_at IS NULL
                   AND c.removed_on_platform = false AND ${media('c')}
                   AND c.published_at >= $2 AND c.published_at < $3`,
                [a.id, camp.starts_at, camp.ends_at])).rows[0];
              const geral = (await pool.query(
                `SELECT COALESCE(SUM(c.latest_views),0) AS total FROM contents c
                 WHERE c.social_account_id = $1 AND c.eligible AND c.excluded_at IS NULL
                   AND c.removed_on_platform = false AND ${media('c')}`, [a.id])).rows[0];
              console.log(`${a.public_name} (${a.role}) ${a.platform} | vídeos ${a.videos} | leituras ${a.readings} | regra antiga ${antiga.total} | regra nova ${nova.total} (melhor ${nova.best}) | geral ${geral.total} | ${ms} ms`);
            }
            await pool.end();
          })().catch((error) => {
            console.error('ERRO ' + (error && error.message ? error.message : error));
            process.exit(1);
          });
          JS
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/embaixadores && docker compose -f docker-compose.yml -f docker-compose.vps.yml exec -T app node -" < check.js
